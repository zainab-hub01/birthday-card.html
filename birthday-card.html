<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
            body{
                background-image: url(birth.png);
            background-repeat:no-repeat;
            background-position: 0ch;

            
            }
            .box{
width: 120PX;
height: 67PX;
border: 66px solid rgb(36, 99, 136);
 background-color: rgb(48, 24, 153);
        }
        
    .item{
        text-align: center;
        text-shadow:5px;
       animation: colorchangex 3s  2s 4 ;

    }
    @keyframes colorchangex{
        0%{
            color: crimson;

        }
        20%{
            color: blueviolet;
        }
        30%{
            color: aqua;
        }

        40%{
            color: rgb(144, 238, 172);
        }
        50%{
            color: blue;
        }
        60%{
            color: purple;
        }
        70%{
            color: chartreuse;
        }
        80%{
            color: rgb(5, 89, 246);
        }
        90%{
            color: green;
        }
        100%{
            color: rgb(43, 226, 125);
        }

            </style>
</head>

            </pre>

    </div>

</html>
